
name: Automatisation des tests

on: push

jobs:
  Compilation:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer CMake et compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make gcc
          mkdir build
          cd build
          cmake ..
          make

      - name: Executer les tests
        run: |
          cd build
          make test
