
name: Pipeline CMake

on: push

jobs:
  Compilation:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer les outils et compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make gcc
          mkdir build
          cd build
          cmake ..
          make

      - name: Executer les tests CMake
        run: |
          cd build
          make test

  Test_Add:
    runs-on: ubuntu-latest
    needs: Compilation
    steps:
      - uses: actions/checkout@v4
      - name: Test fonction add
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make gcc
          mkdir build
          cd build
          cmake ..
          make
          test "$(./src/calculator add 10 5)" = "15.000000"

  Test_Sub:
    runs-on: ubuntu-latest
    needs: Compilation
    steps:
      - uses: actions/checkout@v4
      - name: Test fonction sub
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make gcc
          mkdir build
          cd build
          cmake ..
          make
          test "$(./src/calculator sub 10 5)" = "5.000000"

  Test_Mul:
    runs-on: ubuntu-latest
    needs: Compilation
    steps:
      - uses: actions/checkout@v4
      - name: Test fonction mul
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make gcc
          mkdir build
          cd build
          cmake ..
          make
          test "$(./src/calculator mul 5 5)" = "25.000000"

  Test_Div:
    runs-on: ubuntu-latest
    needs: Compilation
    steps:
      - uses: actions/checkout@v4
      - name: Test fonction div
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make gcc
          mkdir build
          cd build
          cmake ..
          make
          test "$(./src/calculator div 10 2)" = "5.000000"

  Test_Car:
    runs-on: ubuntu-latest
    needs: Compilation
    steps:
      - uses: actions/checkout@v4
      - name: Test fonction car
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make gcc
          mkdir build
          cd build
          cmake ..
          make
          test "$(./src/calculator car 5)" = "25.000000"

  Deploy:
    runs-on: ubuntu-latest
    needs: [Test_Add, Test_Sub, Test_Mul, Test_Div, Test_Car]
    steps:
      - name: Deploiement de la solution
        run: echo "Déploiement de la solution"
